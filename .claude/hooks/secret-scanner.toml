# Gitleaks config for UserPromptSubmit secret-scanner
# Extends the built-in ruleset with patterns gitleaks defaults miss (as of v8.30).

[extend]
useDefault = true

# --- Cloudflare -----------------------------------------------------------
[[rules]]
id          = "cloudflare-user-api-token"
description = "Cloudflare user API token (cfut_ prefix)"
regex       = '''\bcfut_[A-Za-z0-9]{40,}\b'''
keywords    = ["cfut_"]

# --- Supabase (service role & project keys) -------------------------------
[[rules]]
id          = "supabase-service-role"
description = "Supabase service_role or personal API key (sbp_)"
regex       = '''\bsbp_[A-Za-z0-9]{40,}\b'''
keywords    = ["sbp_"]

# --- Turso DB tokens ------------------------------------------------------
[[rules]]
id          = "turso-db-token"
description = "Turso database token (tl_)"
regex       = '''\btl_[A-Za-z0-9]{40,}\b'''
keywords    = ["tl_"]

# --- Anthropic (gitleaks has sk-ant but rule set varies) ------------------
[[rules]]
id          = "anthropic-api-key"
description = "Anthropic API key"
regex       = '''\bsk-ant-(?:api\d+-)?[A-Za-z0-9_-]{80,}\b'''
keywords    = ["sk-ant-"]
